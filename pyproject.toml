[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pensive"
version = "0.1.0"
requires-python = ">=3.13"

[project.optional-dependencies]
dev = ["pytest", "numpy", "scipy", "ruff>=0.6"]
corpus = ["zstandard"]
baselines = ["torch", "torchvision"]
stage0 = ["datasets", "transformers", "sentence-transformers", "torch"]

[tool.setuptools.packages.find]
include = ["eval", "eval.stream", "eval.stream.generators", "eval.subject", "eval.subject.oracles", "eval.subjects", "eval.metrics", "eval.run", "eval.baselines", "eval.gate", "workspace", "core", "codecs_module", "train"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF",
    "PLE", "PLW", "PLC", "TRY", "BLE", "PIE", "ISC",
]
ignore = [
    "E501",    # line length handled by formatter, long strings in specs
    "TRY003",  # long exception messages are fine here
]
