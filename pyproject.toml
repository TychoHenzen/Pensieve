[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pensive"
version = "0.1.0"
requires-python = ">=3.13"

[project.optional-dependencies]
dev = ["pytest", "numpy", "scipy"]
corpus = ["zstandard"]
baselines = ["torch", "torchvision"]
stage0 = ["datasets"]

[tool.setuptools.packages.find]
include = ["eval", "eval.stream", "eval.stream.generators", "eval.subject", "eval.subject.oracles", "eval.metrics", "eval.run", "eval.baselines", "workspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
