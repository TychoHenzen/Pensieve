name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-format:
    name: python-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install formatter
        run: python -m pip install --disable-pip-version-check "ruff==0.16.4"
      - name: Check formatting
        run: ruff format --check .

  python-lint:
    name: python-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install lint dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"
      - name: Run lint
        run: ruff check .

  python-type-check:
    name: python-type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install type-check dependencies
        run: python -m pip install --disable-pip-version-check ".[dev,corpus,baselines,stage0]"
      - name: Run Pyright
        run: pyright

  python-tests:
    name: python-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check ".[dev,corpus,baselines,stage0]"
      - name: Run tests
        run: pytest -q

  python-coverage:
    name: python-coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install coverage dependencies
        run: python -m pip install --disable-pip-version-check ".[dev,corpus,baselines,stage0]"
      - name: Run tests with coverage
        run: >-
          pytest -q
          --cov=codecs_module
          --cov=core
          --cov=eval
          --cov=train
          --cov=workspace
          --cov-report=term-missing
          --cov-report=xml

  python-dependency-audit:
    name: python-dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install audit tool
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"
      - name: Audit declared dependencies
        run: pip-audit . --progress-spinner off

  github-workflow-syntax:
    name: github-workflow-syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "$archive" actionlint
      - name: Lint GitHub Actions workflows
        run: ./actionlint
